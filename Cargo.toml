[workspace]
members = ["crates/aic-cli", "crates/aic-data", "crates/aic-pilot-native", "crates/aic-torch", "crates/aic-learning"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
aic-data = { path = "crates/aic-data" }
aic-torch = { path = "crates/aic-torch" }
aic-learning = { path = "crates/aic-learning" }
aic-pilot-native = { path = "crates/aic-pilot-native" }
anyhow = "1"
cc = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
good_lp = { version = "1", default-features = false, features = ["microlp"] }
microlp = "0.6"
indexmap = "2"
pumpkin-solver = "0.5"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
tch = "0.26"

[workspace.lints.rust]
unsafe_code = "forbid"
