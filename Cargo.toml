[workspace]
members = ["crates/aic-cli", "crates/aic-data"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
aic-data = { path = "crates/aic-data" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
good_lp = { version = "1", default-features = false, features = ["microlp"] }
pumpkin-solver = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
