[workspace]
members = ["crates/aic-cli", "crates/aic-data", "crates/aic-pilot-native", "crates/aic-torch", "crates/aic-learning", "crates/aic-layout", "crates/aic-routing", "crates/aic-layout-gen", "crates/aic-recipe-layout-gen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
ahash = "0.8"
aic-layout = { path = "crates/aic-layout" }
aic-layout-gen = { path = "crates/aic-layout-gen" }
aic-recipe-layout-gen = { path = "crates/aic-recipe-layout-gen" }
aic-routing = { path = "crates/aic-routing" }
aic-data = { path = "crates/aic-data" }
aic-torch = { path = "crates/aic-torch" }
aic-learning = { path = "crates/aic-learning" }
aic-pilot-native = { path = "crates/aic-pilot-native" }
anyhow = "1"
cc = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fs4 = "1"
good_lp = { version = "1", default-features = false, features = ["microlp"] }
microlp = "0.6"
indexmap = "2"
pumpkin-solver = "0.5"
rayon = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
tch = "0.26"

[workspace.lints.rust]
unsafe_code = "forbid"
